services:
  frigate-ai-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: frigate-ai-proxy
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=INFO
      - MAX_OUTPUT_TOKENS=600
      - MAX_SAMPLED_IMAGES=20
      - UPSTREAM_VLM_BASE_URL=https://api.elorian.ai/v1
      - UPSTREAM_VLM_MODEL=glimpse
      - UPSTREAM_VLM_API_KEY=${UPSTREAM_VLM_API_KEY:-}
      - UPSTREAM_THREAT_ENABLED=false
      - UPSTREAM_THREAT_BASE_URL=https://api.typesafe.ai/v1
      - UPSTREAM_THREAT_MODEL=jev-latest
      - UPSTREAM_THREAT_API_KEY=${UPSTREAM_THREAT_API_KEY:-}
