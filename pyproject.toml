[project]
name = "frigate-ai-proxy"
version = "0.2.0"
description = "Fast, cost-efficient AI proxy and threat intelligence gateway for Frigate NVR Generative AI"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Israel Saba" }]
keywords = [
    "frigate",
    "frigate-nvr",
    "frigate-extension",
    "generative-ai",
    "ai-proxy",
    "openai-compatible",
    "computer-vision",
    "glimpse",
    "threat-detection",
    "cctv",
    "surveillance",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "loguru>=0.7.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "ignore:directory \"/run/secrets\" does not exist:UserWarning",
]
